<!DOCTYPE html>
<html> <head> 
<title>Yousra's DIV List</title>
<style>
    .flex-container {
      display: flex;  flex-direction:row;
      background-color: red;
  }

.flex-container > div {  /*div children of the flex container*/
  background-color: #f1f1f1; 
  margin: 10px;  padding: 20px;  font-size: 30px;
}

/* Responsive layout */
@media (max-width: 600px) { 
	 .flex-container{
		 flex-direction:column;
		 background-color: green;
	  }
	}
</style></head>



<body>

    <h1>Yousra builds list with divs</h1>

    <div class="flex-container" id="target">
        <div class="divlist">row item 1</div>
        <div class="divlist">row item 2</div>
        <div class="divlist">row item 3</div>
    </div>

    <p>Enter an item to add to the list.</p>

    <input type="text" id="itemInput"
           placeholder="Enter an item">

    <button onclick="makeNewDiv()">Add end</button>
	
<button onclick="addFront()">Add front</button>
<button onclick="removeEveryOther()">Remove</button>

<button onclick="shuffleItems()">Shuffle</button>



</body>

<script>
	
function makeNewDiv() {
    // Get the text from the input
    let itemText = document.getElementById("itemInput").value;

    // Create a new div
    let element = document.createElement("div");

    // Add the text and class
    element.innerHTML = itemText;
    element.className = "divlist";

    // Add the new div to the end
    let container = document.getElementById("target");
    container.appendChild(element);
}

function addFront() {
    // Get the text from the input
    let itemText = document.getElementById("itemInput").value;

    // Create a new div
    let element = document.createElement("div");

    // Set the text and class
    element.innerHTML = itemText;
    element.className = "divlist";

    // Add the new div to the front
    let container = document.getElementById("target");
    container.insertBefore(element, container.firstChild);
}

function removeEveryOther() {
    // Get all divlist elements
    let divListItems = document.getElementsByClassName("divlist");

    // Remove the first, third, fifth, etc.
    for (let i = divListItems.length - 1; i >= 0; i--) {
        if (i % 2 === 0) {
            divListItems[i].remove();
        }
    }
}

function shuffleItems() {
    // Get all items in the list
    let container = document.getElementById("target");
    let items = container.getElementsByClassName("divlist");

    // Need at least two items to shuffle
    if (items.length < 2) {
        return;
    }

    // Pick two different random positions
    let firstIndex = Math.floor(Math.random() * items.length);
    let secondIndex = Math.floor(Math.random() * (items.length - 1));

    if (secondIndex >= firstIndex) {
        secondIndex++;
    }

    let firstItem = items[firstIndex];
    let secondItem = items[secondIndex];

    // Swap the two div elements
    let placeholder = document.createComment("swap");

    container.replaceChild(placeholder, firstItem);
    container.replaceChild(firstItem, secondItem);
    container.replaceChild(secondItem, placeholder);
}



</script>
</html>
