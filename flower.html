
<!DOCTYPE html>

    <title>Yousra's Flower Hunt</title>

        }

            color: darkgreen;
        }

            cursor: pointer;
        }
    
    
.game-board {
    margin-top: 20px;
}

.game-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
}

.location {
    width: 90px;
    height: 90px;
}

.location img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border: 2px solid darkgreen;
    border-radius: 5px;
    box-sizing: border-box;
    cursor: pointer;
}
</style>

</head>

<div class="game-board">

</div>


<script>
    // Game variables
    let ids = Array.from({length: 36}, (_, i) => "img" + i);

    let score = 0;
    let locationsVisited = 0;
    let lastLocation = 0;

    let poisonLocation = 19;
    let roseLocation = 14;
    let lilyLocations = [3, 25];
    let daisyLocations = [2, 5, 11, 20, 21];

    let gameOver = false;
    let scoredPositions = [];

    // Check what is hiding behind a bush
    function check(position) {
        if (gameOver) {
            return;
        }

        let imageId = ids[position];
        let image = document.getElementById(imageId);

        locationsVisited++;

        if (position === poisonLocation) {
            image.src = "images/poison.jfif";
            score -= 4;
            gameOver = true;
            image.onclick = null;
        }
        else if (position === roseLocation) {
            image.src = "images/rose.jfif";

            if (!scoredPositions.includes(position)) {
                score += 4;
                scoredPositions.push(position);
            }
        }
        else if (lilyLocations.includes(position)) {
            image.src = "images/lily.jfif";

            if (!scoredPositions.includes(position)) {
                score += 2;
                scoredPositions.push(position);
            }
        }
        else if (daisyLocations.includes(position)) {
            image.src = "images/daisy.jfif";

            if (!scoredPositions.includes(position)) {
                score += 1;
                scoredPositions.push(position);
            }
        }
        else {
            image.onclick = null;
        }

        lastLocation = position;

        document.getElementById("locations").textContent =
            "Number of locations checked is " + locationsVisited + ".";

        document.getElementById("score").textContent =
            "Score is " + score + ".";
    }

    
function help() {
    let row = Math.floor(lastLocation / 6);
    let col = lastLocation % 6;

    // Four neighbors, allowing wraparound
    let neighbors = [
        row * 6 + ((col + 5) % 6),
        row * 6 + ((col + 1) % 6),
        ((row + 5) % 6) * 6 + col,
        ((row + 1) % 6) * 6 + col
    ];

    let result = "warm";

    // Check for nearby daisies first
    if (neighbors.some(pos => daisyLocations.includes(pos))) {
        result = "cold";
    }
    else {
        // Check the surrounding 3x3 area without wraparound
        function isNearby(position) {
            let targetRow = Math.floor(position / 6);
            let targetCol = position % 6;

            return Math.abs(row - targetRow) <= 1 &&
                   Math.abs(col - targetCol) <= 1;
        }

        if (isNearby(roseLocation)) {
            result = "hot";
        }
        else if (isNearby(poisonLocation)) {
            result = "watch out";
        }
    }

    document.getElementById("help").textContent =
        "Help report: " + result;

    return result;
}

</script>
