        }

        #locations, #score, #help {

.game-board {

}

.game-row {

}

.location {
    width: 90px;
    height: 90px;
}

.location img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border: 2px solid darkgreen;
    border-radius: 5px;
    box-sizing: border-box;
    cursor: pointer;
}
</style>
