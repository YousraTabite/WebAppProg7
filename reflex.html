<!DOCTYPE html>
<html lang="en">
<head>
  
<title>Yousra's Reflex Game</title>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" 
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" 
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>  

  </head>
<body>
  <h1>Yousra reflexes</h1>


<h2>Test Your Reflexes!</h2>

<div id="target">Your time</div>

<div id="counter">Count</div>

<br>

<button type="button" class="btn btn-primary"
        onclick="beginTime()">
    Go
</button>

<button type="button" class="btn btn-danger"
        onclick="recordTime()">
    Halt
</button>

  
  <script>
    
let haltTime = undefined;

function recordTime() {
    haltTime = Date.now();
    console.log("Halt button pressed at: " + haltTime);
}

function beginTime() {
    haltTime = undefined;

    document.getElementById("target").innerHTML = "Your time";
    document.getElementById("counter").innerHTML = "5";

    // Countdown from 5 to 0
    for (let i = 0; i <= 5; i++) {
        setTimeout(function() {
            document.getElementById("counter").innerHTML = i;
        }, (5 - i) * 1000);
    }

    // Check how close the player was to zero
    setTimeout(function() {
        let targetTime = Date.now();

        if (haltTime === undefined || haltTime > targetTime) {
            document.getElementById("target").innerHTML =
                "Not soon enough";
        }
        else {
            let elapsedTime = targetTime - haltTime;

            document.getElementById("target").innerHTML =
                "Time was " + elapsedTime + " milliseconds before zero.";
        }
    }, 5000);
}



 
  </script>

</body>
</html>
